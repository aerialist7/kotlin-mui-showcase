before-command: |
  #!/bin/bash
  set -e

  # Pre-download Gradle wrapper and dependencies, pre-compile sources
  ./gradlew --no-daemon jsMainClasses
preview-commands:
  - id: dev-server
    title: Kotlin/JS Dev Server
    description: Starts the Kotlin/JS Webpack Dev Server with continuous build
    command: |
      #!/bin/bash
      set -e

      # Start the Kotlin/JS dev server on port 8080
      # Dev server config (host, port, allowedHosts) is in webpack.config.d/dev-server.js
      ./gradlew --no-daemon jsBrowserDevelopmentRun -t
preview-port: 8080
